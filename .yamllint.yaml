---
extends: default

# See: https://yamllint.readthedocs.io/en/stable/rules.html
rules:
  anchors:
    forbid-duplicated-anchors: true
    forbid-unused-anchors: true
  braces:
    min-spaces-inside: 1
    max-spaces-inside: 1
    max-spaces-inside-empty: 0
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
    max-spaces-inside-empty: 0
  comments:
    min-spaces-from-content: 1
  empty-lines:
    max: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
  key-duplicates:
    forbid-duplicated-merge-keys: true # NOTE (@NickLarsenNZ): I prefer false
  line-length:
     # NOTE (@NickLarsenNZ): I would prefer something a little wider like 100
     # or 120
    max: 80
    level: warning
  quoted-strings:
    quote-type: double
    required: only-when-needed
  truthy:
    check-keys: false
